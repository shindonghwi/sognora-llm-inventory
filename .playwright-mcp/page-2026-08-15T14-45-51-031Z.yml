            - paragraph [ref=e891]: "부모님댁 20년 이상 된 엘베 없는 5층 빌라(사다리차 필수) 주방 시공 했어요~ 첫 시공이라 신뢰와 A/S가 젤 중요해서 오늘의집에서 했고요! 부모님이 화장실을 동네 업체에서 시공하셨는데 비뚤비뚤 마감도 안 좋았어요... 처음엔 오늘의 집 본사 가서 매니저님과 만났고 그 다음부터는 카톡으로 소통했습니다. 타일은 타일시공업자와 따로 연락(오늘의집에서 소개받음), 타일 자재는 시공하는 분이 알려준 타일 가게 가서 직접 보고 골랐어요^^ 계약서를 전자상으로 체결하는 편리성. 친절한 매니저님, 시공을 조심스럽게 잘 해주셨다는 시공팀(부모님이 시공 때 옆에서 지켜 보시더니 그렇게 잘하신다고 하시더라고요) 모든 분들 다 친절하였고 천장 몰딩 조각 무늬가 있는데 주방 상부장과 타일시공이 매끄럽게 잘 되었습니다. 주방 타일은 합리적인 가격이었어요. 참고로 타일은 시공 전 대강 비용을 물어보시고요, 시공해야 정확한 비용이 나온다더라고요. 주방 상하부장은 #보르떼3으로 부드러운 쨍하지 않은 화이트(아이보리-화이트 중간느낌), 마감도 좋습니다. 서랍 모서리가 다소 뾰족한? 느낌은 있지만 상식적이고 문제 없어요. 삼성냉장고 화이트가 좀더 화이트하지만 거의 비슷해 보여요. 인조대리석은 #오로라비스크. 블랑이 예뻐 보였는데 타일의 따뜻한 색과 비슷하게 하고 싶었고 음식물이 잘 닿는 곳이라 은은한 밝은 베이지로 했어요. 또 연세 많으신 부모님 집이라 차분하게 했어요. 실제로 보면 누렇거나 어둡지 았고 적당히 밝고 따뜻한 색감이라 고급스럽고 예쁩니다! 화사한 주방을 원하면 블랑이 좋을거 같아요 비스크는 비교적 노란끼가 있고 차분한 느낌입니다. 부모님이 시공 후에 넘 좋아하세요~! 저처럼 경험이 없는 분들께 팁을 드리자면, *시공일은 하루~이틀정도 여유롭게 더 생각하세요. 작업이다 보니 오늘의집은 잘 맞춰주셨지만 변수가 있을 수 있어요. *미리 원하는 디자인, 색감, 디테일한 부분(예를들어 주방 같은 경우는 식기 건조대를 달것인지, 서랍장은 몇칸이면 좋겠는지 등)을 생각하고 매니저님과 가능한지 소통해 가심 좋을거 같아요. *타일은 직접 타일 업체(연결해주심) 가셔서 눈으로 보고 고르세요. 색감, 질감, 가격 등 그 업체도 친절히 응대해주셨어요. *주방 인조대리석은 샘플을 보아도 전체적인 디자인을 상상하기 어렵더라고요. 인스타그램에 실제 설치하신 분들꺼 여러개 보면서 가장 원하는 색감을 찾아보세요! 실제로 보니 비슷하더라고요. 인조대리석은 무늬가 있어서 샘플과 전체 큰 상판이랑 원하는 느낌이 다를 수 있을거 같아요. 전 이렇게 했더니 딱 원하는 그림이 나왔답니다. 아무쪼록 스트레스 없이 부모님네 주방을 싹 바꿔드렸습니다!! 오늘의 집 원래도 좋아하는 감성브랜드였는데 좋은 추억이 생겼습니다. 앞으로 시공쪽에서 대박이 나길! ♡ 이번에 도배를 못한게 아쉽습니다.. :)"
